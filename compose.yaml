services:
  website:
    image: node:24-bookworm
    working_dir: /site
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/site
      - dependencies:/site/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
volumes:
  dependencies:
